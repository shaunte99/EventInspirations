<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Event Inspirations</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="styles/contact.css">
</head>
<body>

<!-- HERO -->
<section class="contact-hero">
  <video autoplay muted loop playsinline>
    <source src="images/AQMWpPQRC_GgONPv3_InvxrblpbFcgTYb0ZnTognnwKpIvXC9cvzcHaI5pPgLy6JdXl5TVLKRWL9Mxrr7sW1ycgYsWXbql7S.mp4" type="video/mp4">
  </video>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <h1>Get in Touch</h1>
    <p>We’d love to hear about your dream event</p>
  </div>
</section>

<!-- CONTACT FORM -->
<section class="contact-form-section">
  <form action="mailto:info@eventinspirations.co.za" method="POST" class="contact-form">
    <input type="text" name="name" placeholder="Your Name" required>
    <input type="email" name="email" placeholder="Email Address" required>
    <input type="tel" name="phone" placeholder="Phone Number (Optional)">
    <select name="eventType" required>
      <option value="" disabled selected>Select Event Type</option>
      <option>Wedding</option>
      <option>Corporate</option>
      <option>Birthday</option>
      <option>Other</option>
    </select>
    <textarea name="message" placeholder="Tell us about your event" required></textarea>
    <button type="submit">Send Message</button>
  </form>
</section>

<!-- CONTACT INFO -->
<section class="contact-info">
  <div class="contact-item"><i class="fab fa-instagram"></i> @eventinspirations</div>
  <div class="contact-item"><i class="fab fa-facebook-f"></i> /eventinspirations</div>
  <div class="contact-item"><i class="fab fa-whatsapp"></i> +27 123 456 789</div>
  <div class="contact-item"><i class="fas fa-envelope"></i> info@eventinspirations.co.za</div>
  <div class="contact-item"><i class="fas fa-map-marker-alt"></i> Muldersdrift, South Africa</div>
</section>

<!-- FOOTER -->
<footer>
  <p>© 2026 Event Inspirations</p>
  <span>Powered by <strong>WebCrate</strong></span>
</footer>

</body>
</html>
